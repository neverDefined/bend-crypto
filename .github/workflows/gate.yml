name: gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  BEND_VERSION: 2.0.40
  BEND_SHA256: c9ff8d67bd903fb6ad9a26b43d8a62c01021de82a44d55ce4a3dcd4732113d6b
  LEAN_VERSION: 4.34.0
  LEAN_SHA256: caaa98356098c85dc0fcbbd28e1ec66f39eb6551829972b752ff20e1286b646b

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Bend
        run: |
          name="bend-$BEND_VERSION-linux-x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -fsSLO \
            "https://github.com/bendlang/bend/releases/download/v$BEND_VERSION/$name"
          echo "$BEND_SHA256  $name" | sha256sum -c -
          tar -xzf "$name"
          mkdir -p "$HOME/.bend/bin"
          mv bend/bend2 bend/guide "$HOME/.bend/"
          mv bend/bin/bend "$HOME/.bend/bin/bend"
          rm -rf bend "$name"
          echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
      # --verdict builds its Lean kernel once; a cached build needs no Lean
      - id: kernel
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bend/bendtt
          key: bendtt-${{ env.BEND_VERSION }}-${{ env.LEAN_VERSION }}
      - name: Install Lean
        if: steps.kernel.outputs.cache-hit != 'true'
        run: |
          name="lean-$LEAN_VERSION-linux.tar.zst"
          curl --proto '=https' --tlsv1.2 -fsSLO \
            "https://github.com/leanprover/lean4/releases/download/v$LEAN_VERSION/$name"
          echo "$LEAN_SHA256  $name" | sha256sum -c -
          dir="$HOME/.elan/toolchains/leanprover--lean4---v$LEAN_VERSION"
          mkdir -p "$dir"
          tar --zstd -xf "$name" -C "$dir" --strip-components=1
          rm "$name"
      - run: make gate
